<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InnovAction Scan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: panneau d'instruments — bandeau de navigation collant, bande de synthèse Comex, quadrants 2×2 qui s'empilent sur téléphone. */
:root {
  --bg: #ECEFF2; --surface: #FFFFFF; --surface-2: #F4F6F8; --ink: #15212B; --muted: #596673; --line: #D5DCE2;
  --accent: #1D5E6A; --accent-soft: #DCEAEC; --on-accent: #FFFFFF;
  --ok: #2E7A4D; --warn: #A2650F; --crit: #B0372C;
  --ok-soft: #E0EFE5; --warn-soft: #F5EAD6; --crit-soft: #F5DFDB;
  --t-dys: #3E66A2; --t-cont: #874C8E; --t-rup: #687818;
  --font-d: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-m: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E151B; --surface: #16212A; --surface-2: #1B2731; --ink: #E2E8ED; --muted: #94A2AE; --line: #2A3743;
  --accent: #62B3BF; --accent-soft: #1B3A40; --on-accent: #0E151B;
  --ok: #5DBA82; --warn: #E0A54C; --crit: #E46C5E;
  --ok-soft: #173326; --warn-soft: #3A2D16; --crit-soft: #3D1F1B;
  --t-dys: #7FA4DE; --t-cont: #C48ACB; --t-rup: #AFC15A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16212A; --surface-2: #1B2731; --ink: #E2E8ED; --muted: #94A2AE; --line: #2A3743;
  --accent: #62B3BF; --accent-soft: #1B3A40; --on-accent: #0E151B;
  --ok: #5DBA82; --warn: #E0A54C; --crit: #E46C5E;
  --ok-soft: #173326; --warn-soft: #3A2D16; --crit-soft: #3D1F1B;
  --t-dys: #7FA4DE; --t-cont: #C48ACB; --t-rup: #AFC15A; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-b); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-d); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-family: var(--font-m); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin: 0 auto; }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-d); font-size: 1.25rem; letter-spacing: -0.02em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
nav.tabs a { padding: 6px 12px; border-radius: var(--r); text-decoration: none; color: var(--muted); white-space: nowrap; font-weight: 500; }
nav.tabs a:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.scope { display: flex; align-items: center; gap: 8px; }
select, input[type="text"], input[type="number"], input[type="search"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

main { padding-block: 22px 60px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; margin-bottom: 18px; }
.page-head p { color: var(--muted); max-width: 70ch; }

/* Bande de synthèse */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .big { font-family: var(--font-d); font-size: 2.1rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile.sds { flex-direction: row; align-items: center; gap: 14px; }

/* Quadrants */
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head .idx { font-family: var(--font-m); color: var(--accent); font-size: 12px; margin-right: 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-m); font-size: 10px; }
.chart .lbl { fill: var(--ink); font-family: var(--font-b); font-size: 11px; font-weight: 500; }
.chart .grid { stroke: var(--line); fill: none; }
.chart .axis { stroke: var(--muted); }

.bars { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 2.5rem; gap: 6px 10px; align-items: center; }
.bars .bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bars .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.chip { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: var(--surface-2); white-space: nowrap; }
.chip .d { font-family: var(--font-m); font-size: 10px; }
.up { color: var(--crit); } .down { color: var(--ok); }

.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .01em; }
.pill.dys { background: color-mix(in srgb, var(--t-dys) 16%, transparent); color: var(--t-dys); }
.pill.cont { background: color-mix(in srgb, var(--t-cont) 16%, transparent); color: var(--t-cont); }
.pill.rup { background: color-mix(in srgb, var(--t-rup) 18%, transparent); color: var(--t-rup); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.sf { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface-2); border-radius: var(--r); padding: 8px 10px 8px 0; }
.alert .sev { align-self: stretch; border-radius: 0 3px 3px 0; }
.alert.crit .sev { background: var(--crit); } .alert.warn .sev { background: var(--warn); } .alert.info .sev { background: var(--accent); }
.alert b { font-weight: 600; }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* Boucle fermée */
.axes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.axis-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.axis-top { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
.layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.layer { border-top: 2px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.layer.voulue { border-color: var(--muted); } .layer.realisee { border-color: var(--accent); } .layer.vecue { border-color: var(--t-cont); }
.kpi { display: flex; flex-direction: column; gap: 3px; }
.kpi input[type="range"] { width: 100%; accent-color: var(--accent); }
.kpi .row { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.orient { border-radius: var(--r); padding: 10px 12px; }
.orient.crit { background: var(--crit-soft); } .orient.warn { background: var(--warn-soft); } .orient.ok { background: var(--ok-soft); }
.method { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.formula { font-family: var(--font-m); font-size: 12px; background: var(--surface-2); padding: 8px 10px; border-radius: var(--r); overflow-x: auto; }

/* Récits */
.recits-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 76px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.recit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.recit-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.struct { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 3px 12px; font-size: 13.5px; }
.struct dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
.struct dd { margin: 0; }
.isolated { font-size: 12px; color: var(--muted); }
.isolated s { text-decoration-color: var(--crit); }
.list { display: flex; flex-direction: column; gap: 10px; }
.spark { display: block; }

/* Collecte */
.collect { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.qcards { display: grid; gap: 8px; }
.qcard { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; cursor: pointer; }
.qcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.qcard b { display: block; font-size: 12px; font-family: var(--font-m); color: var(--accent); font-weight: 500; }
.formrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.formrow label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.steps { display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: 0; }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-m); font-size: 11px; background: var(--accent-soft); color: var(--accent); }
.hl { padding: 0 2px; border-radius: 3px; }
.hl.ner { background: var(--accent-soft); color: var(--accent); font-family: var(--font-m); font-size: 12px; }
.hl.jug { background: var(--crit-soft); color: var(--crit); text-decoration: line-through; }
.textview { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.decision { border-radius: var(--r); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.decision.ok { background: var(--ok-soft); } .decision.crit { background: var(--crit-soft); }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; }

/* Dispositif */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.guard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.guard:last-child { border-bottom: 0; }
pre.code { margin: 0; font-family: var(--font-m); font-size: 12px; background: var(--surface-2); border-radius: var(--r); padding: 10px; overflow: auto; max-height: 220px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 20; }
.demo-note { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); padding: 6px 10px; }

@keyframes ping { from { r: 9; opacity: .9; } to { r: 18; opacity: 0; } }
.ping { animation: ping 2.2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .ping { animation: none; opacity: .5; } }

@media (max-width: 980px) {
  .quad, .axes, .collect, .grid2, .method { grid-template-columns: minmax(0, 1fr); }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recits-layout { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; }
}
@media (max-width: 560px) {
  .strip { grid-template-columns: minmax(0, 1fr); }
  .layers { grid-template-columns: minmax(0, 1fr); }
  .formrow { grid-template-columns: minmax(0, 1fr); }
  .bars { grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) 2rem; }
  .struct { grid-template-columns: minmax(0, 1fr); }
  .struct dt { padding-top: 6px; }
}
</style>
</head>
<body>
<header class="top gutter">
  <div class="wrap">
    <div class="brand"><b>InnovAction<span>·</span>Scan</b><small>Signaux faibles &amp; gouvernance</small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#pilotage">Vue Comex</a>
      <a href="#boucle">Boucle stratégique</a>
      <a href="#recits">Récits &amp; clusters</a>
      <a href="#collecte">Collecte narrative</a>
      <a href="#dispositif">Dispositif &amp; BI</a>
    </nav>
    <label class="scope small muted" for="scope">Périmètre
      <select id="scope">
        <option value="">Toutes les parties prenantes</option>
      </select>
    </label>
  </div>
</header>
<main class="gutter"><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   InnovAction Scan — prototype
   Toutes les données sont fictives (organisation industrielle ETI).
   Le « moteur NLP » est une simulation à base de règles, exécutée
   localement dans le navigateur, pour illustrer la chaîne de traitement.
   ============================================================ */

const DAY = 864e5;
const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
const NOW = TODAY.getTime();

const PP = ["Collaborateurs", "Clients", "Fournisseurs", "Régulateurs & ONG"];
const PP_CODE = { "Collaborateurs": "COL", "Clients": "CLI", "Fournisseurs": "FOU", "Régulateurs & ONG": "ECO" };
const CANAUX = {
  "Collaborateurs": ["Bouton « Irritant terrain » (ERP)", "Cohorte mensuelle (email)", "QR code atelier"],
  "Clients": ["Formulaire post-action", "Communauté bêta", "Cohorte (SMS)"],
  "Fournisseurs": ["Portail fournisseurs", "Revue trimestrielle"],
  "Régulateurs & ONG": ["Veille RSS juridique", "Veille rapports ONG"]
};
const TYPES = {
  dys: { label: "Dysfonctionnement répété", short: "Dysfonctionnement", cls: "dys", color: "var(--t-dys)", w: 1 },
  cont: { label: "Solution de contournement", short: "Contournement", cls: "cont", color: "var(--t-cont)", w: 1.5 },
  rup: { label: "Rupture externe anticipée", short: "Rupture externe", cls: "rup", color: "var(--t-rup)", w: 1.3 }
};
const QUESTIONS = [
  { id: "Q1", titre: "L'événement marquant", texte: "Pensez à votre expérience avec notre organisation au cours des 30 derniers jours. Racontez un événement précis qui a concrètement modifié votre façon de travailler ou d'interagir avec nous." },
  { id: "Q2", titre: "La friction opérationnelle", texte: "Racontez la dernière fois où vous vous êtes dit : « Ce n'est pas possible de fonctionner ainsi ». Que s'est-il passé précisément (étapes, outils, conséquences) ?" },
  { id: "Q3", titre: "L'étonnement / l'anomalie", texte: "Qu'avez-vous observé ou vécu récemment au sein de notre écosystème qui vous a surpris car cela sortait totalement des procédures habituelles ?" }
];

/* ---------- Axes stratégiques (stratégie voulue + réalisée) ---------- */
const AXES = [
  { id: "carbone", nom: "Décarbonation & supply chain", cible: "−30 % d'émissions scope 3 d'ici 2028",
    kpis: [
      { id: "k1", nom: "Réduction émissions scope 3", unite: "%", valeur: 18, cible: 30, min: 0, max: 40, sens: "up" },
      { id: "k2", nom: "Fournisseurs conformes RSE", unite: "%", valeur: 92, cible: 90, min: 50, max: 100, sens: "up" }
    ],
    lecture: "Alerte de faisabilité : la stratégie se heurte à la réalité du marché fournisseurs. Réviser les critères ou accompagner le panel." },
  { id: "ops", nom: "Excellence opérationnelle", cible: "+15 % de productivité par la digitalisation",
    kpis: [
      { id: "k3", nom: "Taux d'adoption de l'ERP", unite: "%", valeur: 94, cible: 90, min: 40, max: 100, sens: "up" },
      { id: "k4", nom: "Temps de traitement d'un dossier", unite: "j", valeur: 2.1, cible: 2.5, min: 1, max: 6, sens: "down", step: 0.1 }
    ],
    lecture: "Alerte d'illusion de performance : le terrain compense manuellement (double saisie, tableurs). Suspendre la V2, réallouer le budget sur l'ergonomie." },
  { id: "innov", nom: "Innovation & marché", cible: "Pénétrer le segment B2B industriel",
    kpis: [
      { id: "k5", nom: "Ventes nouvelle offre (vs plan)", unite: "%", valeur: 61, cible: 100, min: 0, max: 130, sens: "up" },
      { id: "k6", nom: "Coût d'acquisition client", unite: "€", valeur: 1450, cible: 1100, min: 600, max: 2500, sens: "down", step: 10 }
    ],
    lecture: "Alerte d'opportunité : le marché ciblé réagit mal, mais une niche adjacente (agricole) crée un usage spontané. Étudier un pivot du budget marketing." },
  { id: "conf", nom: "Conformité & licence à opérer", cible: "Zéro non-conformité majeure",
    kpis: [
      { id: "k7", nom: "Audits de conformité réussis", unite: "%", valeur: 100, cible: 100, min: 50, max: 100, sens: "up" },
      { id: "k8", nom: "Incidents sécurité déclarés", unite: "", valeur: 2, cible: 3, min: 0, max: 12, sens: "down" }
    ],
    lecture: "Alerte réglementaire précoce : une restriction PFAS se dessine chez les concurrents et des incidents ne remontent pas au registre officiel." }
];

/* ---------- Clusters de faits (issus du clustering non supervisé) ---------- */
const CLUSTERS = [
  { id: "erp", label: "Tableurs parallèles pour compenser l'ERP", court: "Tableurs ERP", type: "cont", axe: "ops", pp: ["Collaborateurs"], proc: ["Administration des ventes", "Comptabilité", "Planification production"], grav: [3, 4],

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seedRecits() {

  for (const c of CLUSTERS) {
    c.weeks.forEach((count, w) => {
      for (let k = 0; k < count; k++) {
        const t = c.tpl[(n + k) % c.tpl.length];
        const pp = pick(r, c.pp);
        const age = (11 - w) * 7 + r() * 6.9;
        out.push({
          id: "R-" + String(n++).padStart(4, "0"), ts: NOW - age * DAY, pp, canal: pick(r, CANAUX[pp]),
          cohorte: PP_CODE[pp] + "-" + String(100 + Math.floor(r() * 60)), question: pick(r, QUESTIONS).id,

/* ---------- Calculs ---------- */
const ageOf = r => (NOW - r.ts) / DAY;
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function clusterStats(recs) {
  return CLUSTERS.map(c => {
    const rs = recs.filter(r => r.cluster === c.id);
    const cur = rs.filter(r => ageOf(r) < 28), prev = rs.filter(r => ageOf(r) >= 28 && ageOf(r) < 56);
    const weeks = Array.from({ length: 12 }, (_, i) => rs.filter(r => { const a = ageOf(r); return a >= (11 - i) * 7 && a < (12 - i) * 7; }).length);
    const g = arr => arr.length ? mean(arr.map(r => r.grav)) : null;
    const vel = (cur.length - prev.length) / (prev.length + 1);
    const cohorts = new Set(cur.map(r => r.cohorte)).size;
    return {
      ...c, rs, n: rs.length, c2: cur.length, c1: prev.length,
      g2: g(cur) ?? g(rs) ?? c.grav[0], g1: g(prev) ?? g(cur) ?? c.grav[0],
      vel, cohorts, groups: new Set(cur.map(r => r.pp)).size, weeks,
      weak: cur.length > 0 && cur.length <= 10 && vel >= 1.5 && cohorts >= 3,
      confirmed: cur.length > 0 && prev.length > 0 && cohorts >= 3
    };
  }).filter(c => c.id !== "nc" || c.n > 0);
}

function attainment(k) {
  const v = +k.valeur, c = +k.cible;
  if (k.sens === "up") return clamp(c === 0 ? 1 : v / c, 0, 1);
  return clamp(v === 0 ? 1 : c / v, 0, 1);
}
function axisSDS(axe, stats) {
  const h = mean(axe.kpis.map(attainment));
  const linked = stats.filter(s => s.axe === axe.id);
  const P = linked.reduce((s, c) => s + c.c2 * (c.g2 / 5) * TYPES[c.type].w * (1 + 0.25 * Math.max(c.vel, 0)), 0);
  const p = 1 - Math.exp(-P / 20);
  return { h, p, P, sds: 1 + 9 * h * p, linked };
}

const fmt1 = x => x.toLocaleString("fr-FR", { maximumFractionDigits: 1, minimumFractionDigits: 1 });

function polar(cx, cy, r, deg) { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; }
function arc(cx, cy, r, d0, d1) { const [x0, y0] = polar(cx, cy, r, d0), [x1, y1] = polar(cx, cy, r, d1); return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${Math.abs(d1 - d0) > 180 ? 1 : 0} 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; }

function gauge(v, size = 120) {
  const cx = 60, cy = 58, r = 46, deg = x => 180 - (x - 1) / 9 * 180;
  const seg = (a, b, col) => `<path d="${arc(cx, cy, r, deg(a), deg(b))}" stroke="${col}" stroke-width="10" fill="none" opacity=".22"/>`;
  const [nx, ny] = polar(cx, cy, r - 16, deg(v));
  return `<svg class="chart" viewBox="0 0 120 74" style="width:${size}px" role="img" aria-label="Score de divergence ${fmt1(v)} sur 10">

    <path d="${arc(cx, cy, r, 180, deg(v))}" stroke="var(--${band(v)})" stroke-width="10" fill="none"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>

}
function spark(arr, w = 96, h = 24, col = "var(--accent)") {
  const max = Math.max(1, ...arr), step = w / (arr.length - 1);
  const pts = arr.map((v, i) => [i * step, h - 2 - v / max * (h - 4)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="0,${h} ${line} ${w},${h}" fill="${col}" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${col}"/></svg>`;
}

/* ---------- Radar de vélocité ---------- */
function velR(v) {
  if (v < 0) return 18 + (clamp(v, -1, 0) + 1) * 22;
  if (v < 0.5) return 40 + v / 0.5 * 30;
  if (v < 1.5) return 70 + (v - 0.5) * 35;
  return 105 + clamp((v - 1.5) / 2.5, 0, 1) * 35;
}
function radar(stats) {
  const cx = 170, cy = 160, sectors = { dys: [90, 210], cont: [330, 450], rup: [210, 330] };
  let s = `<svg class="chart" viewBox="-70 0 480 330" style="max-width:520px;margin:0 auto" role="img" aria-label="Radar de vélocité des clusters">`;
  [[40, "Stable"], [70, "Croissance"], [105, "Accélération"], [140, "Emballement"]].forEach(([r, l]) => {
    s += `<circle class="grid" cx="${cx}" cy="${cy}" r="${r}"/><text x="${cx + 3}" y="${cy - r + 11}">${l}</text>`;
  });
  for (const d of [90, 210, 330]) { const [x, y] = polar(cx, cy, 148, d); s += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  const [lx3, ly3] = polar(cx, cy, 152, 270);

  s += `<text x="404" y="14" text-anchor="end" style="fill:var(--t-cont)">Contournements</text>`;
  s += `<text x="${lx3.toFixed(0)}" y="${(ly3 + 14).toFixed(0)}" text-anchor="middle" style="fill:var(--t-rup)">Ruptures externes</text>`;
  for (const t of Object.keys(sectors)) {
    const items = stats.filter(c => c.type === t && c.n > 0), [a0, a1] = sectors[t];
    items.forEach((c, i) => {
      const deg = a0 + (a1 - a0) * (i + 1) / (items.length + 1), r = velR(c.vel);
      const [x, y] = polar(cx, cy, r, deg), rad = 4 + Math.sqrt(c.c2) * 1.8;
      if (c.weak) s += `<circle class="ping" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rad + 4).toFixed(1)}" fill="none" stroke="var(--accent)" stroke-dasharray="3 2"/>`;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${TYPES[c.type].color}" fill-opacity=".85"><title>${esc(c.label)} — ${c.c2} récits (28 j), vélocité ${pct(c.vel)}</title></circle>`;
      const right = x >= cx;
      s += `<text class="lbl" x="${(x + (right ? rad + 4 : -rad - 4)).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${right ? "start" : "end"}">${esc(c.court)}</text>`;
    });
  }
  return s + `</svg>`;
}

/* ---------- Matrice de matérialité ---------- */
function matrix(stats) {
  const W = 420, H = 310, L = 40, R = 16, T = 28, B = 34, items = stats.filter(c => c.n > 0);
  const xmax = Math.max(10, ...items.map(c => Math.max(c.c1, c.c2))) * 1.1;
  const X = v => L + v / xmax * (W - L - R), Y = g => T + (5 - g) / 4 * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matrice de matérialité : fréquence par gravité">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>
    <rect x="${X(xmax / 2)}" y="${T}" width="${W - R - X(xmax / 2)}" height="${Y(3) - T}" fill="var(--crit)" opacity=".07"/>`;
  for (let g = 1; g <= 5; g++) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(g)}" y2="${Y(g)}"/><text x="${L - 8}" y="${Y(g) + 3}" text-anchor="end">${g}</text>`;
  const step = xmax > 30 ? 10 : 5;
  for (let v = 0; v <= xmax; v += step) s += `<text x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${v}</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">Fréquence du fait constaté (récits, 28 derniers jours)</text>`;
  s += `<text transform="translate(11 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">Gravité modélisée (1–5)</text>`;
  s += `<text x="${W - R - 6}" y="${T + 13}" text-anchor="end" style="fill:var(--crit)">Arbitrage Comex</text>`;
  for (const c of items) {
    const x0 = X(c.c1), y0 = Y(c.g1), x1 = X(c.c2), y1 = Y(c.g2);
    if (Math.hypot(x1 - x0, y1 - y0) > 8) s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#ah)"/>`;
  }
  for (const c of items) {
    const x1 = X(c.c2), y1 = Y(c.g2), rad = 5 + Math.sqrt(c.cohorts) * 1.5;
    s += `<circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="${rad.toFixed(1)}" fill="${TYPES[c.type].color}" fill-opacity=".85" stroke="var(--surface)" stroke-width="1.5"><title>${esc(c.label)} : ${c.c2} récits, gravité ${fmt1(c.g2)} (période précédente : ${c.c1} récits)</title></circle>`;
    const right = x1 < W - 110;
    s += `<text class="lbl" x="${(x1 + (right ? rad + 4 : -rad - 4)).toFixed(1)}" y="${(y1 - rad - 2).toFixed(1)}" text-anchor="${right ? "start" : "end"}">${esc(c.court)}</text>`;
  }
  return s + `</svg>`;
}

/* ---------- Lexique des verbes d'action (pression sémantique) ---------- */
const VERBES = [["contourn", "contourner"], ["ressais", "ressaisir"], ["recopi", "recopier"], ["export", "exporter"], ["fractionn", "fractionner"], ["retir", "retirer"], ["bloqu", "bloquer"], ["refus", "refuser"], ["échou", "échouer"], ["appel", "appeler"], ["modifi", "modifier"], ["arrêt", "arrêter"], ["livr", "livrer"], ["command", "commander"], ["utilis", "utiliser"], ["saisi", "saisir"], ["fix", "fixer"], ["vend", "vendre"]];
function verbPressure(recs) {
  const txt = r => (r.ctx + " " + r.fait + " " + r.csq).toLowerCase();
  const cur = recs.filter(r => ageOf(r) < 28).map(txt), prev = recs.filter(r => ageOf(r) >= 28 && ageOf(r) < 56).map(txt);
  const count = (arr, st) => arr.reduce((n, t) => n + (t.match(new RegExp("\\b" + st, "g")) || []).length, 0);
  return VERBES.map(([st, v]) => ({ v, n: count(cur, st), p: count(prev, st) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 12);
}

/* ---------- Alertes ---------- */
function buildAlerts(stats) {
  const out = [];
  for (const a of AXES) {
    const r = axisSDS(a, stats);
    if (r.sds >= 7) out.push({ sev: "crit", cl: r.linked.slice().sort((x, y) => y.c2 - x.c2)[0]?.id, html: `<b>SDS ${fmt1(r.sds)} — ${esc(a.nom)}</b><br><span class="muted small">KPI au vert (${Math.round(r.h * 100)} % d'atteinte) mais pression terrain forte. Orientation corrective du Conseil à inscrire à l'ordre du jour.</span>` });
  }
  for (const c of stats.filter(c => c.weak)) out.push({ sev: "warn", cl: c.id, obs: !c.confirmed, html: `<b>Signal faible : ${esc(c.label)}</b><br><span class="muted small">${c.c2} récits, vélocité ${pct(c.vel)}, ${c.cohorts} cohortes indépendantes.${c.confirmed ? "" : " En observation : double enregistrement non atteint, pas d'action corrective à ce stade."}</span>` });
  for (const c of stats.filter(c => c.g2 >= 4.5 && c.c2 > 0 && !c.weak)) out.push({ sev: "crit", cl: c.id, html: `<b>Gravité critique : ${esc(c.label)}</b><br><span class="muted small">${c.c2} récits sur 28 j, gravité moyenne ${fmt1(c.g2)}/5.</span>` });
  return out;
}

/* ---------- Moteur de nettoyage (simulation à base de règles) ---------- */
const JUGEMENTS = ["catastroph", "nul", "nulle", "nuls", "incompétent", "incompétente", "incompétents", "scandal", "horrible", "inadmissible", "lamentable", "génial", "géniale", "super", "ridicule", "stupide", "absurde", "honteu", "inacceptable", "débile", "minable", "pathétique", "n'importe quoi", "usine à gaz", "amateurisme", "fainéant", "idiot", "insupportable", "déplorable", "aberrant", "incroyable", "nulle part ailleurs", "comme d'habitude", "pas fiable", "irréaliste", "personne ne nous écoute", "inconscient", "j'en ai marre", "c'est toujours pareil", "lamentablement", "n'importe comment", "mauvais", "excellent", "parfait", "désastre", "honte", "pitoyable"];
const ACTIONS_LX = ["contourn", "utilis", "saisi", "ressais", "recopi", "export", "import", "bloqu", "refus", "échou", "attend", "relanc", "livr", "command", "appel", "arrêt", "retir", "fractionn", "modifi", "envoy", "reçu", "déclar", "valid", "créé", "ferm", "répar", "perd", "annul", "passé", "install", "fix", "vend", "achet", "test", "remplac", "imprim", "calcul", "signal", "constat", "mesur", "publi"];
const PRENOMS = ["Jean", "Marie", "Pierre", "Sophie", "Nicolas", "Julie", "Thomas", "Isabelle", "Laurent", "Nathalie", "Philippe", "Céline", "Paul", "Claire", "Michel", "Sandrine", "Karim", "Fatima", "David", "Sarah", "Kevin", "Léa", "Lucas", "Emma", "Hugo", "Camille", "Antoine", "Julien", "Christophe", "Valérie", "Éric", "Eric", "Stéphane", "Mohamed", "Olivier", "Patrick", "François", "Martine", "Catherine", "Alain", "Bernard", "Sylvie", "Benoît", "Aurélie", "Mehdi", "Inès", "Yann", "Manon"];
const ROLES_RX = /\b(nous|l'équipe|mon équipe|le client|les clients|le fournisseur|le transporteur|l'acheteur|les acheteurs|le technicien|les techniciens|le chef d'équipe|l'opérateur|le commercial|le régulateur|l'autorité|l'ONG|le sous-traitant|le service client|la comptabilité|le magasinier|le revendeur|mon manager|mon responsable|la direction)\b/gi;
const PERSON_REF = /\[PERSONNE\]|\b(mon chef|ma cheffe|mon manager|mon responsable|ma responsable|mon collègue|ma collègue|le directeur|la directrice)\b/i;

function maskNER(text) {
  const marks = [];
  let t = text;
  const rep = (rx, tag) => { t = t.replace(rx, m => { marks.push([m, tag]); return tag; }); };
  rep(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[EMAIL]");
  rep(/(?:\+33\s?|\b0)[1-9](?:[\s.-]?\d{2}){4}\b/g, "[TÉLÉPHONE]");
  rep(/\b(?:M\.|Mme|Mlle|Mr|Monsieur|Madame)\s+[A-ZÉÈÀ][\wéèêëàâîïôöûüç'-]+(?:\s+[A-ZÉÈÀ][\wéèêëàâîïôöûüç'-]+)?/g, "[PERSONNE]");
  rep(new RegExp("\\b(?:" + PRENOMS.join("|") + ")(?:\\s+[A-ZÉÈÀ][A-Za-zéèêëàâîïôöûüç'-]+)?\\b", "g"), "[PERSONNE]");
  return { text: t, marks };
}
function findJudgments(s) {
  const low = s.toLowerCase(), hits = [];
  for (const j of JUGEMENTS) {
    const rx = new RegExp("(^|[^\\p{L}])(" + j.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\p{L}*)", "giu");
    let m; while ((m = rx.exec(low))) hits.push(s.substr(m.index + m[1].length, m[2].length));
  }
  return [...new Set(hits)];
}
const hasFactMarker = s => /\d/.test(s) || ACTIONS_LX.some(a => s.toLowerCase().includes(a));

function analyse(raw, meta) {
  const ner = maskNER(raw);
  const sentences = ner.text.split(/(?<=[.!?])\s+|\n+/).map(s => s.trim()).filter(Boolean);
  const isolated = [], kept = [], contacts = [];
  for (const s of sentences) {
    const clauses = s.split(/(?<=[,;:])\s+/);
    const keptCl = [];
    for (const cl of clauses) {
      if (/\[(EMAIL|TÉLÉPHONE)\]/.test(cl)) { contacts.push(cl.replace(/[,;:.!?]+$/, "")); continue; }
      const j = findJudgments(cl);
      if (!j.length && /\[PERSONNE\]/.test(cl) && !/\d/.test(cl)) { isolated.push(cl.replace(/[,;:.!?]+$/, "")); continue; }
      if (!j.length) { keptCl.push(cl); continue; }
      if (hasFactMarker(cl)) {
        let c2 = cl;
        for (const w of j) { c2 = c2.replace(new RegExp("(vraiment |totalement |complètement |très |trop |franchement )?" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), ""); isolated.push(w); }
        c2 = c2.replace(/\s{2,}/g, " ").replace(/\s+([,.;:])/g, "$1").trim();
        if (c2.replace(/[^\p{L}\d]/gu, "").length > 8) keptCl.push(c2);
      } else { isolated.push(cl.replace(/[,;:.!?]+$/, "")); }
    }
    if (keptCl.length) kept.push(keptCl.join(" ").replace(/[,;:]\s*$/, "."));
  }
  const clean = kept.join(" ");
  const low = clean.toLowerCase();
  const quand = [...new Set((clean.match(/(?<![\p{L}\d])(hier|avant-hier|ce matin|cet après-midi|ce soir|aujourd'hui|la semaine dernière|le mois dernier|ce mois-ci|cette semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{1,2} (?:janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre))(?![\p{L}])/giu) || []))];
  const ou = [...new Set((clean.match(/(?<![\p{L}])(?:à l'|à la |au |sur le |sur la |dans l'|dans le |dans la )?(?:étape \d+|atelier \w+|entrepôt(?: \w+)?|site de \w+|quai \d+|ligne \d+|service \w+|portail \w+|ERP|CRM|agence \w+|magasin \w+|usine(?: de \w+)?)(?![\p{L}])/giu) || []).map(s => s.trim()))];
  const qui = [...new Set((clean.match(ROLES_RX) || []).map(s => s.toLowerCase()).concat(clean.includes("[PERSONNE]") ? ["[personne masquée]"] : []))];
  const impactRx = /\d+(?:[,.]\d+)?\s?(?:h\b|heures?|min(?:utes)?|jours?|semaines?|mois|€|k€|%|t\b|tonnes?|pièces|commandes|clients|erreurs?|unités|bons)/gi;
  const impacts = clean.match(impactRx) || [];
  const quoi = kept.find(s => ACTIONS_LX.some(a => s.toLowerCase().includes(a))) || kept[0] || "";
  const factCount = impacts.length + quand.length + ou.length + ACTIONS_LX.filter(a => low.includes(a)).length;
  const fact = clean ? clamp(factCount / (factCount + 1.5 * isolated.length + 1), 0.05, 0.98) : 0;
  const sc = { cont: 0, rup: 0, dys: 0.5 };
  ["contourn", "du coup", "on utilise", "nous utilisons", "excel", "tableur", "à la main", "manuellement", "en parallèle", "astuce", "nous avons dû", "on a dû", "détourn", "au lieu de", "fractionn", "ressais", "recopi"].forEach(k => { if (low.includes(k)) sc.cont += 1; });
  ["régulateur", "norme", "sanction", "mise en demeure", "décret", "loi ", "ong", "jurisprudence", "restriction", "autorité", "réglementation", "consultation publique"].forEach(k => { if (low.includes(k)) sc.rup += 1.2; });
  ["bloqu", "impossible", "erreur", "panne", "retard", "échou", "refus", "404", "ne fonctionne", "ne répond", "arrêt"].forEach(k => { if (low.includes(k)) sc.dys += 1; });
  const type = Object.entries(sc).sort((a, b) => b[1] - a[1])[0][0];
  let best = { id: "nc", s: 0 };
  for (const c of CLUSTERS) { const s = c.kw.filter(k => low.includes(k)).length; if (s > best.s) best = { id: c.id, s }; }
  const cluster = best.s >= 2 ? best.id : "nc";
  let grav = 2 + (impacts.length ? 1 : 0) + (impacts.length > 1 ? 1 : 0);
  if (/sécurité|accident|blessé|incendie|tension|chute|consignation/i.test(low)) grav = 5;
  grav = clamp(grav, 1, 5);
  const adHominem = (PERSON_REF.test(ner.text) && isolated.length > 0 && factCount < 3) || (!clean && isolated.length > 0);
  const tooShort = clean.replace(/[^\p{L}]/gu, "").length < 25;
  let decision = "accept", motif = "";
  if (adHominem) { decision = "reject"; motif = "Attaque personnelle sans fait vérifiable : le récit est orienté vers le canal de médiation, hors tableau de bord."; }
  else if (tooShort || fact < 0.3) { decision = "reject"; motif = "Récit trop pauvre en faits (étapes, outils, chiffres, conséquences). L'émetteur est invité à compléter son récit."; }
  const ctx = kept.length > 2 ? kept[0] : "";
  const rest = kept.filter(s => s !== ctx);
  const fait = rest.find(s => ACTIONS_LX.some(a => s.toLowerCase().includes(a))) || rest[0] || "";
  const after = rest.filter(s => s !== fait);
  const csq = after.filter(s => /retard|arrêt|perte|perdu|rupture|erreur|annul|surcoût|reporté|impossible/i.test(s) || (s.match(impactRx) || []).length).join(" ") || after.join(" ");
  return { raw, ner, isolated, contacts, clean, quand, ou, qui, impacts, quoi, type, cluster, grav, fact, decision, motif, ctx: ctx || meta.proc + ".", fait, csq, sc };
}

function toCSV(rows) {
  const head = ["id", "date", "partie_prenante", "cohorte", "canal", "type", "cluster", "axe", "processus", "gravite", "factualite", "contexte", "fait", "consequence"];
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  return [head.join(";")].concat(rows.map(r => [r.id, new Date(r.ts).toISOString().slice(0, 10), r.pp, r.cohorte, r.canal, r.type, r.cluster, CL[r.cluster]?.axe || "", r.proc, r.grav, r.fact.toFixed(2), r.ctx, r.fait, r.csq].map(q).join(";"))).join("\n");
}

    state.user.push(rec); store.set("recits", state.user);

    clearTimeout(render._t); render._t = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); document.getElementById(t.id)?.focus(); }, 60);
  }
  if (t.dataset.plan) { state.plan[t.dataset.plan] = +t.value || 0; if (t.type === "range") { const y = scrollY; render(); scrollTo(0, y); document.getElementById(t.id)?.focus(); } }
  if (t.id === "c-text") state.draft.text = t.value;
  if (t.id === "f-q") { state.filters.q = t.value; clearTimeout(render._q); render._q = setTimeout(() => { render(); const el = document.getElementById("f-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "status") { const a = state.actions.find(a => a.id === t.dataset.id); a.statut = t.value; store.set("actions", state.actions); toast(a.id + " : " + a.statut); render(); }
  if (t.dataset.plan && t.type === "number") render();
  if (t.id === "c-pp") { state.draft.pp = t.value; state.draft.canal = CANAUX[t.value][0]; render(); }
  if (t.id === "c-canal") state.draft.canal = t.value;
  if (t.id === "c-proc") state.draft.proc = t.value;
  if (t.id === "f-cl") { state.filters.cluster = t.value; state.shown = 25; render(); }
  if (t.id === "f-ty") { state.filters.type = t.value; state.shown = 25; render(); }
});

render();
</script>
</body>
</html>
